<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MÖWEStudio</title>
<meta name="description" content="MÖWEStudio が作っている Android アプリの案内と、プライバシーポリシーの置き場です。">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16202e;
    --sub: #667085; --line: #e4e7ec; --link: #1b3a6b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141820; --card: #1c222c; --text: #e8ecf2;
      --sub: #9aa4b2; --line: #2b323d; --link: #8fb6f0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141820; --card: #1c222c; --text: #e8ecf2;
    --sub: #9aa4b2; --line: #2b323d; --link: #8fb6f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.85; font-size: 16px;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: .02em; }
  .tag { color: var(--sub); font-size: 14px; margin: 0 0 32px; }
  h2 { font-size: 17px; margin: 32px 0 12px; }
  .app {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px;
  }
  .app h3 { margin: 0 0 4px; font-size: 17px; }
  .app p { margin: 0 0 10px; color: var(--sub); font-size: 14px; }
  a { color: var(--link); }
  ul { padding-left: 1.2em; margin: 8px 0; }
  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line);
           color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">

<h1>MÖWEStudio</h1>
<p class="tag">個人で Android アプリを作っています。</p>

<h2>アプリ</h2>
<div class="app">
  <h3>ゲーセン手帳 - アケログ</h3>
  <p>ゲームセンターでの支出とプレイを記録する手帳。全国の店舗一覧と地図つき。</p>
  <ul>
    <li><a href="akelog/privacy.html">プライバシーポリシー</a></li>
  </ul>
</div>

<h2>お問い合わせ</h2>
<p><a href="mailto:mowestudio.dayo@gmail.com">mowestudio.dayo@gmail.com</a></p>

<footer>MÖWEStudio</footer>

</div>
</body>
</html>
